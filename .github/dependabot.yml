version: 2
updates:
  # Minor and patch updates arrive as one grouped PR per month.
  # Major updates aren't in a group, so each one gets its own PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
