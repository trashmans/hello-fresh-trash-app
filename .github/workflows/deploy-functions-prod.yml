name: Deploy Functions Production
run-name: "Deploy Functions: Production"

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

permissions:
  contents: read

jobs:
  deploy:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy to production
        run: |
          supabase functions deploy parse-recipe --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy retry-parse --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy cleanup-recipes --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy admin-reparse --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy admin-set-cover --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
