name: Deploy Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy to preview
        if: github.event_name == 'pull_request'
        run: |
          supabase functions deploy parse-recipe --project-ref ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
          supabase functions deploy retry-parse --project-ref ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
          supabase functions deploy cleanup-recipes --project-ref ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
          supabase functions deploy admin-reparse --project-ref ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy to production
        if: github.event_name == 'push'
        run: |
          supabase functions deploy parse-recipe --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy retry-parse --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy cleanup-recipes --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy admin-reparse --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
