name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
