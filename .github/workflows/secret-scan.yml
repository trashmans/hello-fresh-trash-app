name: Secret Scan
run-name: "Secret scan (${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }})"

# Scans commits for API keys, tokens and passwords with gitleaks. This is a
# public repo, so a leaked key is visible to everyone at once.
#
# - pull_request: every PR to main, including Dependabot (no secrets used).
#   Add "Secret scan" as a required status check on main so a leak blocks
#   the merge.
# - push to main: catches anything that reached main another way.
# - workflow_dispatch: run by hand (Actions tab → Secret Scan → Run workflow)
#   to scan the whole git history.
#
# This is the second line of defence: GitHub push protection (repo
# Settings → Code security) blocks known key formats before they are pushed;
# gitleaks also catches generic-looking keys on PRs and main.
#
# The repo is on a personal account, so gitleaks-action needs no
# GITLEAKS_LICENSE (only organisation-owned repos do). PR comments are off,
# so the job only needs read access and also works on Dependabot PRs.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so gitleaks can scan every commit in the PR or push
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
