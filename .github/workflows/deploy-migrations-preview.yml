name: Deploy Migrations Preview
run-name: "Deploy Migrations: Preview (PR #${{ github.event.number }})"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: read

# One db push at a time per project. Never cancel a push mid-run.
concurrency:
  group: supabase-migrations-preview
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Migrations Preview
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest Supabase CLI 2.x
        id: supabase-cli
        run: echo "version=$(npm view 'supabase@2' version --json | jq -r 'if type == "array" then last else . end')" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ steps.supabase-cli.outputs.version }}

      - name: Deploy to preview
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
