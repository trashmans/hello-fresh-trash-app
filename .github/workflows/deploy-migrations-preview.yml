name: Deploy Migrations Preview
run-name: "Deploy Migrations: Preview (PR #${{ github.event.number }})"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  deploy:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy to preview
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
